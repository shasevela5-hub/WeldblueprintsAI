<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>WeldBlueprint AI - Weld Settings Database</title>
<link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6a00">
<meta name="description" content="Community-tested weld settings for popular welders">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
  --primary: #ff6a00;
  --primary-dark: #e05e00;
  --secondary: #00aaff;
  --dark: #0a0a0a;
  --darker: #050505;
  --card-bg: #141414;
  --text: #ffffff;
  --text-muted: #aaaaaa;
  --success: #00c853;
  --danger: #ff4444;
  --warning: #ffbb33;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
  color: var(--text);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    radial-gradient(circle at 20% 50%, rgba(255,106,0,0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0,170,255,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-size: 3.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 10px 0;
}

.header h1 i {
  margin-right: 10px;
}

.header p {
  color: var(--text-muted);
  font-size: 1.2rem;
}

.nav {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 30px 0;
  flex-wrap: wrap;
}

.nav a {
  padding: 12px 30px;
  background: var(--card-bg);
  border-radius: 30px;
  text-decoration: none;
  color: var(--text);
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav a i {
  color: var(--primary);
}

.nav a:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(255,106,0,0.2);
}

.nav a.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-color: transparent;
  color: black;
}

.nav a.active i {
  color: black;
}

.settings-container {
  display: grid;
  grid-template-columns: 350px 1fr;
  gap: 25px;
  margin-top: 30px;
}

/* Welder List Panel */
.welder-list {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 25px;
  border: 1px solid rgba(255,255,255,0.1);
  height: fit-content;
  position: sticky;
  top: 20px;
}

.welder-list h2 {
  color: var(--primary);
  margin-bottom: 20px;
  font-size: 1.5rem;
}

.welder-list h2 i {
  margin-right: 10px;
}

.search-box {
  margin-bottom: 20px;
}

.search-box input {
  width: 100%;
  padding: 15px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: var(--text);
  font-size: 1rem;
}

.search-box input:focus {
  outline: none;
  border-color: var(--primary);
}

.search-box i {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
}

.welder-items {
  max-height: 600px;
  overflow-y: auto;
  padding-right: 10px;
}

.welder-items::-webkit-scrollbar {
  width: 5px;
}

.welder-items::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
}

.welder-items::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 5px;
}

.welder-item {
  padding: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.3s ease;
  border-radius: 8px;
  margin-bottom: 5px;
}

.welder-item:hover {
  background: rgba(255,106,0,0.1);
  transform: translateX(5px);
}

.welder-item.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: black;
}

.welder-item.active .manufacturer {
  color: rgba(0,0,0,0.7);
}

.welder-item strong {
  font-size: 1.1rem;
  display: block;
  margin-bottom: 5px;
}

.manufacturer {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Settings Panel */
.settings-panel {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 30px;
  border: 1px solid rgba(255,255,255,0.1);
}

.welder-title {
  font-size: 2rem;
  color: var(--primary);
  margin-bottom: 5px;
}

.welder-title i {
  margin-right: 10px;
}

.welder-meta {
  color: var(--text-muted);
  margin-bottom: 30px;
  font-size: 1.1rem;
}

.process-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.process-tab {
  padding: 12px 25px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.process-tab i {
  color: var(--primary);
}

.process-tab:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}

.process-tab.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-color: transparent;
  color: black;
}

.process-tab.active i {
  color: black;
}

.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.setting-card {
  background: rgba(0,0,0,0.3);
  border-radius: 15px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.setting-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.setting-card:hover {
  transform: translateY(-5px);
  border-color: var(--primary);
  box-shadow: 0 10px 30px rgba(255,106,0,0.2);
}

.setting-card:hover::before {
  transform: scaleX(1);
}

.setting-card h4 {
  color: var(--primary);
  font-size: 1.3rem;
  margin-bottom: 15px;
}

.setting-card h4 i {
  margin-right: 8px;
}

.setting-card p {
  margin: 10px 0;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.setting-card p i {
  color: var(--primary);
  width: 20px;
}

.rating {
  color: var(--warning);
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.votes {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-top: 5px;
}

/* Tips Section */
.tips {
  background: rgba(0,0,0,0.3);
  border-radius: 15px;
  padding: 25px;
  margin: 30px 0;
  border-left: 4px solid var(--primary);
}

.tips h3 {
  color: var(--primary);
  margin-bottom: 15px;
  font-size: 1.3rem;
}

.tips h3 i {
  margin-right: 10px;
}

.tips ul {
  list-style: none;
}

.tips li {
  margin: 10px 0;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.tips li i {
  color: var(--success);
}

/* Add Setting Form */
.add-setting {
  background: rgba(0,0,0,0.3);
  border-radius: 15px;
  padding: 30px;
  margin-top: 30px;
  border: 1px solid rgba(255,255,255,0.1);
}

.add-setting h3 {
  color: var(--primary);
  margin-bottom: 20px;
  font-size: 1.5rem;
}

.add-setting h3 i {
  margin-right: 10px;
}

.add-setting input,
.add-setting select,
.add-setting textarea {
  width: 100%;
  padding: 12px 15px;
  margin-bottom: 15px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: var(--text);
}

.add-setting input:focus,
.add-setting select:focus {
  outline: none;
  border-color: var(--primary);
}

.add-setting button {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: black;
  border: none;
  padding: 15px 30px;
  border-radius: 30px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.add-setting button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(255,106,0,0.3);
}

/* Loading State */
.loading {
  text-align: center;
  padding: 50px;
  color: var(--primary);
}

.loading i {
  font-size: 3rem;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Mobile Responsive */
@media (max-width: 968px) {
  .settings-container {
    grid-template-columns: 1fr;
  }
  
  .welder-list {
    position: static;
  }
  
  .header h1 {
    font-size: 2.5rem;
  }
}

@media (max-width: 768px) {
  .container { padding: 10px; }
  .nav a { padding: 10px 20px; }
  .settings-panel { padding: 20px; }
  .welder-title { font-size: 1.5rem; }
  .process-tab { padding: 10px 20px; }
}
</style>
</head>

<body>
<div class="container">
<div class="header">
<h1><i class="fas fa-sliders-h"></i> Weld Settings Database</h1>
<p>Community-tested settings for your exact welder</p>
<div class="nav">
<a href="/"><i class="fas fa-home"></i> Builder</a>
<a href="/settings.html" class="active"><i class="fas fa-sliders-h"></i> Settings DB</a>
<a href="/dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
</div>
</div>

<div class="settings-container">
<!-- Welder List Panel -->
<div class="welder-list">
<h2><i class="fas fa-welding"></i> Welders</h2>
<div class="search-box" style="position:relative;">
<input type="text" id="searchWelders" placeholder="Search welders...">
<i class="fas fa-search"></i>
</div>
<div class="welder-items" id="welderList"></div>
</div>

<!-- Settings Panel -->
<div class="settings-panel">
<div id="welderInfo">
<h2 class="welder-title"><i class="fas fa-hand-pointer"></i> Select a welder</h2>
<p class="welder-meta">Choose a welder from the list to view settings</p>
</div>

<div id="settingsDisplay" style="display:none;">
<div class="process-tabs" id="processTabs"></div>
<div id="settingsGrid" class="settings-grid"></div>
<div id="welderTips" class="tips"></div>

<!-- Add Your Settings -->
<div class="add-setting">
<h3><i class="fas fa-plus-circle"></i> Share Your Settings</h3>
<p style="color:var(--text-muted); margin-bottom:20px;">Help other welders! Share what works for you.</p>
<form id="addSettingForm">
<input type="hidden" id="selectedWelder">
<select id="settingProcess" required>
<option value="">Select Process</option>
<option value="MIG">MIG</option>
<option value="TIG">TIG</option>
<option value="Flux Core">Flux Core</option>
<option value="Stick">Stick</option>
</select>
<input type="text" id="settingThickness" placeholder="Material Thickness (e.g., 3/16)" required>
<input type="text" id="settingVolts" placeholder="Voltage (e.g., 19.5)">
<input type="text" id="settingWireSpeed" placeholder="Wire Speed (IPM)">
<input type="text" id="settingGas" placeholder="Gas (e.g., C25)">
<input type="text" id="settingTechnique" placeholder="Technique (e.g., Push 10°)">
<input type="text" id="userName" placeholder="Your Name (optional)">
<button type="submit"><i class="fas fa-share"></i> Share Settings</button>
</form>
</div>
</div>
</div>
</div>

<div id="loading" class="loading" style="display:none;">
<i class="fas fa-spinner"></i>
<p>Loading settings...</p>
</div>
</div>

<script>
let currentWelder = null
let allWelders = []
const token = localStorage.getItem('token') || sessionStorage.getItem('token') || ''

// Load welders on page load
async function loadWelders() {
document.getElementById('loading').style.display = 'block'
try {
const response = await fetch('/api/welders')
allWelders = await response.json()
displayWelders(allWelders)
} catch(error) {
console.error('Error loading welders:', error)
} finally {
document.getElementById('loading').style.display = 'none'
}
}

// Display welders list
function displayWelders(welders) {
const list = document.getElementById('welderList')
list.innerHTML = ''

welders.forEach(welder => {
const div = document.createElement('div')
div.className = 'welder-item'
div.onclick = () => selectWelder(welder.name)
div.innerHTML = `
<strong>${welder.name}</strong>
<div class="manufacturer">
<i class="fas fa-building"></i> ${welder.manufacturer} | ${welder.type}
</div>
`
list.appendChild(div)
})
}

// Search welders
function searchWelders() {
const search = document.getElementById('searchWelders').value.toLowerCase()
const filtered = allWelders.filter(w => 
w.name.toLowerCase().includes(search) || 
w.manufacturer.toLowerCase().includes(search)
)
displayWelders(filtered)
}

document.getElementById('searchWelders').addEventListener('input', searchWelders)

// Select welder
async function selectWelder(name) {
document.querySelectorAll('.welder-item').forEach(item => {
item.classList.remove('active')
if (item.querySelector('strong').textContent === name) {
item.classList.add('active')
}
})

document.getElementById('loading').style.display = 'block'

try {
const response = await fetch(`/api/settings/${encodeURIComponent(name)}`)
const data = await response.json()
  
document.getElementById('welderInfo').innerHTML = `
<h2 class="welder-title"><i class="fas fa-microchip"></i> ${name}</h2>
<p class="welder-meta"><i class="fas fa-building"></i> ${data.manufacturer} | ${data.type}</p>
`
document.getElementById('settingsDisplay').style.display = 'block'
document.getElementById('selectedWelder').value = name

// Create process tabs
const processes = Object.keys(data.settings)
const tabsHtml = processes.map(p => 
`<button class="process-tab" onclick="showProcess('${p}')"><i class="fas fa-bolt"></i> ${p}</button>`
).join('')
document.getElementById('processTabs').innerHTML = tabsHtml

// Show first process
if (processes.length > 0) {
showProcess(processes[0])
}

// Show tips
const tipsHtml = `
<h3><i class="fas fa-lightbulb"></i> Pro Tips for ${name}</h3>
<ul>
${data.tips.map(tip => `<li><i class="fas fa-check-circle"></i> ${tip}</li>`).join('')}
</ul>
`
document.getElementById('welderTips').innerHTML = tipsHtml

} catch(error) {
console.error('Error loading settings:', error)
} finally {
document.getElementById('loading').style.display = 'none'
}
}

// Show process settings
function showProcess(process) {
document.querySelectorAll('.process-tab').forEach(tab => {
tab.classList.remove('active')
if (tab.textContent.includes(process)) {
tab.classList.add('active')
}
})

const welderName = document.getElementById('selectedWelder').value
fetch(`/api/settings/${encodeURIComponent(welderName)}`)
.then(res => res.json())
.then(data => {
const settings = data.settings[process]
const grid = document.getElementById('settingsGrid')
grid.innerHTML = ''

Object.entries(settings).forEach(([thickness, details]) => {
const card = document.createElement('div')
card.className = 'setting-card'
let detailsHtml = `<h4><i class="fas fa-ruler"></i> ${thickness}" Material</h4>`
if (details.volts) detailsHtml += `<p><i class="fas fa-bolt"></i> Volts: ${details.volts}V</p>`
if (details.wireSpeed) detailsHtml += `<p><i class="fas fa-tachometer-alt"></i> Wire Speed: ${details.wireSpeed} IPM</p>`
if (details.amps) detailsHtml += `<p><i class="fas fa-battery-full"></i> Amps: ${details.amps}A</p>`
if (details.gas) detailsHtml += `<p><i class="fas fa-wind"></i> Gas: ${details.gas}</p>`
detailsHtml += `<p><i class="fas fa-hand-pointer"></i> Technique: ${details.technique}</p>`
detailsHtml += `<div class="rating"><i class="fas fa-star"></i> ${details.rating}/5</div>`
detailsHtml += `<div class="votes"><i class="fas fa-users"></i> ${details.votes} votes</div>`
card.innerHTML = detailsHtml
grid.appendChild(card)
})
})
}

// Add setting form
document.getElementById('addSettingForm').addEventListener('submit', async function(e) {
e.preventDefault()

const data = {
welder: document.getElementById('selectedWelder').value,
process: document.getElementById('settingProcess').value,
thickness: document.getElementById('settingThickness').value,
volts: document.getElementById('settingVolts').value,
wireSpeed: document.getElementById('settingWireSpeed').value,
gas: document.getElementById('settingGas').value,
technique: document.getElementById('settingTechnique').value,
userName: document.getElementById('userName').value || 'Anonymous'
}

try {
const response = await fetch('/api/settings/add', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
...(token ? { 'Authorization': `Bearer ${token}` } : {})
},
body: JSON.stringify(data)
})

const result = await response.json()
if (result.success) {
alert('✅ Settings shared! Thank you for contributing.')
this.reset()
}
} catch(error) {
alert('Error sharing settings: ' + error.message)
}
})

// Initialize
loadWelders()
</script>
</body>
</html>
